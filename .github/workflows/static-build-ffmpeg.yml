# Static ffmpeg build (Linux amd64, GPL).
# Produces a fully statically-linked ffmpeg + ffprobe + SHA256SUMS.
#
# All codec + text-rendering libraries are compiled FROM SOURCE as static
# archives into /opt/ff (see scripts/build-ffmpeg-static.sh), because Alpine's
# apk does not ship static archives for all of them (libass has none).
# License: linked against GPL libs (x264/x265/aom/...) -> binary is GPL.
#          fdk-aac is intentionally NOT enabled (non-free).

name: static-build-ffmpeg

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: "8.1.2"

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.20

    steps:
      - name: Checkout build script
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # linux-headers provides /usr/include/linux/videodev2.h, which ffmpeg's
          # configure auto-probes. Without it the v4l2 indev/outdev + every
          # *_v4l2m2m hwaccel codec are silently disabled. build-base does NOT
          # pull linux-headers in (only musl-dev/bsd-headers), so name it here.
          apk add --no-cache \
            bash build-base pkgconf nasm yasm cmake meson ninja \
            linux-headers \
            autoconf automake libtool git wget curl tar xz bzip2 gzip \
            file perl python3 patch ca-certificates gperf diffutils

      - name: Build static ffmpeg and all libraries
        shell: bash
        run: bash scripts/build-ffmpeg-static.sh

      - name: Strip and verify static linking
        run: |
          strip /opt/ff/bin/ffmpeg /opt/ff/bin/ffprobe
          echo "=== file ==="; file /opt/ff/bin/ffmpeg /opt/ff/bin/ffprobe
          echo "=== ldd ==="; ldd /opt/ff/bin/ffmpeg /opt/ff/bin/ffprobe || true
          echo "=== version ==="; /opt/ff/bin/ffmpeg -version | head -20
          echo "=== v4l2 (device + m2m codecs must be present) ==="
          /opt/ff/bin/ffmpeg -hide_banner -devices | grep -E 'video4linux2|v4l2' \
            || { echo "ERROR: v4l2 device missing (linux-headers not installed?)"; exit 1; }
          /opt/ff/bin/ffmpeg -hide_banner -codecs | grep -q v4l2m2m \
            || { echo "ERROR: v4l2_m2m codecs missing"; exit 1; }

      - name: Package
        run: |
          mkdir -p dist
          cp /opt/ff/bin/ffmpeg /opt/ff/bin/ffprobe dist/
          sha256sum dist/ffmpeg dist/ffprobe > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-amd64-static
          path: dist/
